# Toolchain pins: `mise install` gives every developer and CI the same tools.
# A bare "1.25" means the newest 1.25.x release.
[tools]
go = "1.25"
node = "lts"
pnpm = "10"

# Code generation
buf = "1.59"
sqlc = "1.30"
goose = "3.26"

# Local cluster
kubectl = "1.34"
kustomize = "5.8"
kubeconform = "0.7"
k3d = "5.8"
tilt = "0.35"
caddy = "2.11"

# Repository checks
lefthook = "1.13"
gitleaks = "8.28"
actionlint = "1.7"
golangci-lint = "2.6"

# Task runner
task = "3.45"
