version: v2
# Plugins are pinned by version and run locally, so generation needs no network
# beyond `go mod download` and `pnpm install` and never a globally installed plugin:
#   - protoc-gen-go and protoc-gen-connect-go: `tool` directives in backend/go.mod
#   - protoc-gen-es (protobuf-es and Connect-ES v2 service descriptors):
#     devDependency of packages/api-client
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: kiwi/gen
plugins:
  - local: [go, -C, backend, tool, protoc-gen-go]
    out: backend/gen
    opt: paths=source_relative
  - local: [go, -C, backend, tool, protoc-gen-connect-go]
    out: backend/gen
    opt: paths=source_relative
  - local: packages/api-client/node_modules/.bin/protoc-gen-es
    out: packages/api-client/src/gen
    opt: target=ts
inputs:
  - directory: proto
