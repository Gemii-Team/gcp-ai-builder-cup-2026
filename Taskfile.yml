version: '3'

# The single entry point for repository tasks. Tasks are added by the change
# that makes them work.
tasks:
  setup:
    desc: Install the git hooks and the JavaScript dependencies
    cmds:
      - lefthook install
      - pnpm install

  test:
    desc: Run the Go tests (race detector) and the TypeScript tests
    cmds:
      - cd backend && go test -race ./...
      - pnpm -r test

  lint:
    desc: Check Go formatting, run golangci-lint and the TypeScript linters
    cmds:
      - |
        unformatted="$(gofmt -l backend)"
        if [ -n "$unformatted" ]; then
          echo "gofmt: these files need formatting:"
          echo "$unformatted"
          exit 1
        fi
      - cd backend && golangci-lint run
      - pnpm -r lint

  gen:
    desc: Generate code from proto/ (buf generate) and the domain stores from backend/db (sqlc generate)
    preconditions:
      - sh: test -x packages/api-client/node_modules/.bin/protoc-gen-es
        msg: protoc-gen-es is not installed; run `task setup` (pnpm install) first
    cmds:
      - buf generate
      # sqlc stops at a query file that does not exist yet. backend/sqlc.yaml lists
      # every domain, so hand sqlc a copy with only the domains that have theirs.
      - silent: true
        cmd: |
          cd backend
          rc=0
          awk '
            function flush() {
              if (inblock && queries != "" && system("test -f " queries) == 0) { printf "%s", block; kept++ }
              block = ""; queries = ""
            }
            /^  - engine:/ { flush(); inblock = 1 }
            !inblock { print; next }
            { block = block $0 "\n" }
            $1 == "queries:" { queries = $2 }
            END { flush(); exit kept ? 0 : 3 }
          ' sqlc.yaml > .sqlc.gen.yaml || rc=$?
          if [ "$rc" = 0 ]; then
            sqlc generate -f .sqlc.gen.yaml || rc=$?
          elif [ "$rc" = 3 ]; then
            echo "sqlc: no query files in backend/db/queries yet; nothing to generate"
            rc=0
          fi
          rm -f .sqlc.gen.yaml
          exit "$rc"
