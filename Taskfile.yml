version: '3'

# The single entry point for repository tasks. Tasks are added by the change
# that makes them work.
tasks:
  setup:
    desc: Install the git hooks and the JavaScript dependencies
    cmds:
      - lefthook install
      - pnpm install

  test:
    desc: Run the Go tests (race detector) and the TypeScript tests
    cmds:
      - cd backend && go test -race ./...
      - pnpm -r test

  lint:
    desc: Check Go formatting, run golangci-lint and the TypeScript linters
    cmds:
      - |
        unformatted="$(gofmt -l backend)"
        if [ -n "$unformatted" ]; then
          echo "gofmt: these files need formatting:"
          echo "$unformatted"
          exit 1
        fi
      - cd backend && golangci-lint run
      - pnpm -r lint

  gen:
    desc: Generate code from proto/ (buf generate) and the domain stores from backend/db (sqlc generate)
    preconditions:
      - sh: test -x packages/api-client/node_modules/.bin/protoc-gen-es
        msg: protoc-gen-es is not installed; run `task setup` (pnpm install) first
    cmds:
      - buf generate
      # sqlc cannot skip a domain whose query file does not exist yet, so the
      # script hands it a config with only the domains that have one.
      - bash scripts/gen-sqlc.sh
