# Applies the embedded goose migrations as kiwi_owner and exits 0 when the
# schema is already current, so running it again is harmless. It runs the same
# image as kiwi (the migrations are embedded in the binary).
# The pod carries no app.kubernetes.io/part-of label: a finished pod is never
# Ready, and `kubectl wait --for=condition=Ready -l app.kubernetes.io/part-of=kiwi`
# must only see the long-running pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: kiwi
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: job
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: kiwi
          command: ["/app/kiwi", "migrate"]
          env:
            - name: KIWI_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kiwi-env
                  key: KIWI_MIGRATE_DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
