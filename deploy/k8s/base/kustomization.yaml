apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# What every environment runs: the single kiwi process, the web image and the
# migrate Job. Each overlay supplies the ConfigMap kiwi-config, the Secret
# kiwi-env, the PVC kiwi-data and the image names.
resources:
  - kiwi.yaml
  - web.yaml
  - migrate-job.yaml
