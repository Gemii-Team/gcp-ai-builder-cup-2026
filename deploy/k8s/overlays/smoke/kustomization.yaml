apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The mockauth stack with the model replaced by recorded fixtures: kiwi sends its
# chat, embedding and transcription calls to llmreplay (backend/tools/llmreplay)
# and not to LiteLLM and Ollama. The replay, its fixtures and the env patch that
# points kiwi at it are the component ../../components/llmreplay, shared with the
# overlay minimal-smoke.
namespace: kiwi

resources:
  - ../mockauth

components:
  - ../../components/llmreplay
