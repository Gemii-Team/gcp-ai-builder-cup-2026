# The mock sign-in provider: an OIDC provider that lets a developer choose which
# seeded user (or the outsider without a hosted domain) to sign in as. The image
# is the `tools` target of backend/Dockerfile. It holds no secret: it reads no
# Secret, and takes KIWI_ENV from the ConfigMap that kiwi reads, so it refuses to
# start the day that says anything but local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockoidc
  labels:
    app.kubernetes.io/name: mockoidc
    app.kubernetes.io/part-of: kiwi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mockoidc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mockoidc
        app.kubernetes.io/part-of: kiwi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mockoidc
          image: mockoidc
          command: ["/app/mockoidc"]
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: KIWI_ENV
              valueFrom:
                configMapKeyRef:
                  name: kiwi-config
                  key: KIWI_ENV
            # Tokens name this issuer, which is the one kiwi verifies against.
            - name: MOCKOIDC_ISSUER
              value: http://localhost:8080/mockoidc
            # The hosted domain of the users; `task seed -- --domain demo.example`
            # creates the workspace they sign in to.
            - name: MOCKOIDC_HD
              value: demo.example
            - name: MOCKOIDC_USERS
              value: alice@demo.example,bob@demo.example
            # Signs in without a hosted domain, so kiwi turns it away.
            - name: MOCKOIDC_OUTSIDER
              value: carol@elsewhere.example
            # The only address the provider redirects to: the callback of KIWI_PUBLIC_URL.
            - name: MOCKOIDC_REDIRECT_URIS
              value: http://localhost:8080/api/auth/callback
          readinessProbe:
            httpGet:
              path: /mockoidc/.well-known/openid-configuration
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /mockoidc/.well-known/openid-configuration
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: mockoidc
  labels:
    app.kubernetes.io/name: mockoidc
    app.kubernetes.io/part-of: kiwi
spec:
  selector:
    app.kubernetes.io/name: mockoidc
  ports:
    - name: http
      port: 8090
      targetPort: http
