# The provider answers on the same origin as the app: http://localhost:8080/mockoidc.
# Traefik takes the most specific prefix, so /mockoidc reaches the mock and the
# routes of the Ingress kiwi (/api, /ws and /) are untouched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mockoidc
  labels:
    app.kubernetes.io/name: mockoidc
    app.kubernetes.io/part-of: kiwi
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /mockoidc
            pathType: Prefix
            backend:
              service:
                name: mockoidc
                port:
                  number: 8090
