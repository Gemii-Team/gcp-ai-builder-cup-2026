# K.I.W.I.'s two model names (KIWI_LLM_MODEL_FLASH / KIWI_LLM_MODEL_PRO) each spread over several Gemini Flash models.
# The key is on the free tier: 20 requests a day per model, so the router balances across them and moves on when one
# answers 429 (quota) or 503 (busy). Low reasoning effort keeps the thinking inside K.I.W.I.'s 4096-token output limit.
model_list:
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 45
router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 1
  cooldown_time: 3600
  num_retries: 6
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
